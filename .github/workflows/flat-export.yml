name: Flat export

on:
  push:
    branches:
      - flat-export

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build flat ZIP
        shell: bash
        run: |
          zip -j final-answer-flat.zip \
            Analytical-Method.md \
            March-19th.md \
            Model-of-failure-continuation.md \
            Model-of-failure.md \
            Omission.md \
            Protest.md \
            README.md \
            Solicitor_Advisory_Brief_Liam_Moloney.md \
            crisis \
            gdpr.md \
            index.html \
            judge.md \
            lawyer.md \
            the-chat \
            voice.md

      - name: Upload flat ZIP
        uses: actions/upload-artifact@v4
        with:
          name: final-answer-flat
          path: final-answer-flat.zip
          if-no-files-found: error
